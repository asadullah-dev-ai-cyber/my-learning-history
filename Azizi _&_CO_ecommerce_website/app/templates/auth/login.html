{% extends "base.html" %}

{% block title %}Sign In | AZIZI & CO{% endblock %}
{% block namespace %}login{% endblock %}

{% block content %}
<div class="flex min-h-[80vh] items-center justify-center px-5 py-12">
    <div class="w-full max-w-md rounded-3xl border border-white/10 bg-white/[0.02] p-8 backdrop-blur-md sm:p-10">
        <div class="text-center">
            <span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[#dfbb96]">Authentication</span>
            <h1 class="mt-2 text-3xl font-extrabold text-white">Welcome Back</h1>
            <p class="mt-2 text-xs text-neutral-400">Sign in to your account to view past purchases and preferences.</p>
        </div>

        <form action="{{ url_for('auth.login') }}" method="POST" class="mt-8 space-y-5">
            <div>
                <label class="block text-[10px] font-bold uppercase tracking-wider text-neutral-300">Email Address</label>
                <input
                    type="email"
                    name="email"
                    required
                    class="mt-2 w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-xs text-white placeholder-neutral-500 focus:border-[#dfbb96] focus:outline-none"
                    placeholder="name@example.com"
                >
            </div>

            <div>
                <label class="block text-[10px] font-bold uppercase tracking-wider text-neutral-300">Password</label>
                <input
                    type="password"
                    name="password"
                    required
                    class="mt-2 w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-xs text-white placeholder-neutral-500 focus:border-[#dfbb96] focus:outline-none"
                    placeholder="••••••••"
                >
            </div>

            <button type="submit" class="w-full rounded-full bg-[#dfbb96] py-3.5 text-xs font-bold uppercase tracking-widest text-[#050505] transition-all hover:bg-[#ebd0b4]">
                Sign In
            </button>
        </form>

        <p class="mt-6 text-center text-xs text-neutral-400">
            Don't have an account yet?
            <a href="{{ url_for('auth.register') }}" class="font-semibold text-[#dfbb96] hover:underline">Register</a>
        </p>
    </div>
</div>
{% endblock %}
