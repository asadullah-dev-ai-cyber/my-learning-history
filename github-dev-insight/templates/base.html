<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DevInsight{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-background"></div>

    <!-- Header -->
    <header class="site-header">
        <div class="header-container">
            <a href="/" class="logo">⚡ Dev<span>Insight</span></a>
            <nav class="nav-links">
                <a href="/">Home</a>
                <a href="https://github.com" target="_blank" rel="noopener">GitHub API</a>
                <button id="themeToggle" class="theme-toggle-btn">☀️ Light Mode</button>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <p>&copy; 2026 DevInsight &bull; Asadullah Azizi &bull; Designed for Maximum Impact</p>
    </footer>

    <!-- JavaScript Script Link -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
